<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 262" width="980" height="262" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img"><title>Setting up a project, then uploading</title><rect width="980" height="262" fill="#FFFFFF"/><text x="22" y="24" font-size="12" fill="#5B6573" font-weight="600" text-anchor="start">Once per study</text><rect x="30" y="36" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="44" y="62" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Create project</text><text x="44" y="84" font-size="11.5" fill="#5B6573" text-anchor="start">in REDCap</text><text x="44" y="101" font-size="11.5" fill="#5B6573" text-anchor="start">(Development)</text><rect x="270" y="36" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="284" y="62" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Add fields</text><text x="284" y="84" font-size="11.5" fill="#5B6573" text-anchor="start">the app adds the</text><text x="284" y="101" font-size="11.5" fill="#5B6573" text-anchor="start">form's fields</text><line x1="233" y1="78" x2="261" y2="78" stroke="#9AA4B2" stroke-width="1.5"/><path d="M260,74 L267,78 L260,82 Z" fill="#9AA4B2"/><rect x="510" y="36" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="524" y="62" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Test</text><text x="524" y="84" font-size="11.5" fill="#5B6573" text-anchor="start">sample data in</text><text x="524" y="101" font-size="11.5" fill="#5B6573" text-anchor="start">Development</text><line x1="473" y1="78" x2="501" y2="78" stroke="#9AA4B2" stroke-width="1.5"/><path d="M500,74 L507,78 L500,82 Z" fill="#9AA4B2"/><rect x="750" y="36" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="764" y="62" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Production</text><text x="764" y="84" font-size="11.5" fill="#5B6573" text-anchor="start">your REDCap</text><text x="764" y="101" font-size="11.5" fill="#5B6573" text-anchor="start">admin approves</text><line x1="713" y1="78" x2="741" y2="78" stroke="#9AA4B2" stroke-width="1.5"/><path d="M740,74 L747,78 L740,82 Z" fill="#9AA4B2"/><text x="22" y="152" font-size="12" fill="#5B6573" font-weight="600" text-anchor="start">Every upload</text><rect x="30" y="164" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="44" y="190" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Choose file</text><text x="44" y="212" font-size="11.5" fill="#5B6573" text-anchor="start">recognised</text><text x="44" y="229" font-size="11.5" fill="#5B6573" text-anchor="start">automatically</text><rect x="270" y="164" width="200" height="84" rx="10" fill="#E8F0FA" stroke="#1E6BBD"/><text x="284" y="190" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Review</text><text x="284" y="212" font-size="11.5" fill="#5B6573" text-anchor="start">fix or skip</text><text x="284" y="229" font-size="11.5" fill="#5B6573" text-anchor="start">problems</text><line x1="233" y1="206" x2="261" y2="206" stroke="#9AA4B2" stroke-width="1.5"/><path d="M260,202 L267,206 L260,210 Z" fill="#9AA4B2"/><rect x="510" y="164" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="524" y="190" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Upload</text><text x="524" y="212" font-size="11.5" fill="#5B6573" text-anchor="start">in batches</text><line x1="473" y1="206" x2="501" y2="206" stroke="#9AA4B2" stroke-width="1.5"/><path d="M500,202 L507,206 L500,210 Z" fill="#9AA4B2"/><rect x="750" y="164" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="764" y="190" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Result</text><text x="764" y="212" font-size="11.5" fill="#5B6573" text-anchor="start">counts and log</text><line x1="713" y1="206" x2="741" y2="206" stroke="#9AA4B2" stroke-width="1.5"/><path d="M740,202 L747,206 L740,210 Z" fill="#9AA4B2"/></svg>

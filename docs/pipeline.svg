<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" width="860" height="720" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">REDCap Uploader pipeline</title>
  <desc id="desc">A spreadsheet is read, its form recognised, identifiers removed, answers mapped to REDCap codes and every row checked. Rows with problems go back to the user. Clean records are uploaded to the REDCap project in batches, or saved as import files. Explore shows summaries; the result lists what was imported.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E6BBD"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/>
    </marker>
  </defs>

  <rect width="860" height="720" fill="#FFFFFF"/>

  <g font-size="12.5" fill="#5B6573">
    <!-- main column -->
    <rect x="40" y="24" width="440" height="60" rx="10" fill="#F4F7FB" stroke="#DDE3EB"/>
    <text x="60" y="49" font-size="15" font-weight="600" fill="#002157">Spreadsheet</text>
    <text x="60" y="70">.xls, .xlsx or .csv</text>

    <rect x="40" y="108" width="440" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/>
    <text x="60" y="133" font-size="15" font-weight="600" fill="#002157"><tspan fill="#1E6BBD">1</tspan>   Read the layout</text>
    <text x="60" y="154">Title block, header rows, column numbers</text>

    <rect x="40" y="192" width="440" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/>
    <text x="60" y="217" font-size="15" font-weight="600" fill="#002157"><tspan fill="#1E6BBD">2</tspan>   Recognise the form</text>
    <text x="60" y="238">TBC.03 SO or RO profile, or Generic</text>

    <rect x="40" y="276" width="440" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/>
    <text x="60" y="301" font-size="15" font-weight="600" fill="#002157"><tspan fill="#1E6BBD">3</tspan>   Remove identifiers</text>
    <text x="60" y="322">Names dropped, NIK and register number pseudonymised</text>

    <rect x="40" y="360" width="440" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/>
    <text x="60" y="385" font-size="15" font-weight="600" fill="#002157"><tspan fill="#1E6BBD">4</tspan>   Map and clean</text>
    <text x="60" y="406">REDCap fields, answer codes, dates</text>

    <rect x="40" y="444" width="440" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/>
    <text x="60" y="469" font-size="15" font-weight="600" fill="#002157"><tspan fill="#1E6BBD">5</tspan>   Check</text>
    <text x="60" y="490">Required fields, answers, ranges, dates, duplicates</text>

    <rect x="40" y="528" width="440" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/>
    <text x="60" y="553" font-size="15" font-weight="600" fill="#002157"><tspan fill="#1E6BBD">6</tspan>   Upload</text>
    <text x="60" y="574">Batches of 100 through the REDCap API</text>

    <rect x="40" y="636" width="440" height="60" rx="10" fill="#002157"/>
    <text x="60" y="661" font-size="15" font-weight="600" fill="#FFFFFF">REDCap project</text>
    <text x="60" y="682" fill="#C9D6EA">One record per episode</text>

    <!-- main arrows -->
    <g stroke="#1E6BBD" stroke-width="1.5">
      <line x1="260" y1="84" x2="260" y2="106" marker-end="url(#a)"/>
      <line x1="260" y1="168" x2="260" y2="190" marker-end="url(#a)"/>
      <line x1="260" y1="252" x2="260" y2="274" marker-end="url(#a)"/>
      <line x1="260" y1="336" x2="260" y2="358" marker-end="url(#a)"/>
      <line x1="260" y1="420" x2="260" y2="442" marker-end="url(#a)"/>
      <line x1="260" y1="504" x2="260" y2="526" marker-end="url(#a)"/>
      <line x1="260" y1="588" x2="260" y2="634" marker-end="url(#a)"/>
    </g>

    <!-- side column -->
    <rect x="540" y="360" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB" stroke-dasharray="4 4"/>
    <text x="560" y="385" font-size="15" font-weight="600" fill="#002157">Explore</text>
    <text x="560" y="406">Summaries and charts</text>

    <rect x="540" y="444" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/>
    <text x="560" y="469" font-size="15" font-weight="600" fill="#B42318">Problems</text>
    <text x="560" y="490">Listed by row, with how to fix them</text>

    <rect x="540" y="528" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB" stroke-dasharray="4 4"/>
    <text x="560" y="553" font-size="15" font-weight="600" fill="#002157">Import files</text>
    <text x="560" y="574">For REDCap's Data Import Tool</text>

    <rect x="540" y="636" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/>
    <text x="560" y="661" font-size="15" font-weight="600" fill="#002157">Result</text>
    <text x="560" y="682">Imported, rejected, not sent</text>

    <!-- side connectors -->
    <g fill="none" stroke="#9AA4B2" stroke-width="1.5">
      <path d="M480,460 H510 V390 H538" stroke-dasharray="4 4" marker-end="url(#g)"/>
      <line x1="480" y1="482" x2="538" y2="482" marker-end="url(#g)"/>
      <path d="M820,474 H840 V54 H482" stroke-dasharray="4 4" marker-end="url(#g)"/>
      <line x1="480" y1="558" x2="538" y2="558" stroke-dasharray="4 4" marker-end="url(#g)"/>
    </g>
    <line x1="480" y1="666" x2="538" y2="666" stroke="#1E6BBD" stroke-width="1.5" marker-end="url(#a)"/>
  </g>
</svg>

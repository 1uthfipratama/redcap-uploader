<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 184" width="980" height="184" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img"><title>How a spreadsheet becomes REDCap records</title><rect width="980" height="184" fill="#FFFFFF"/><rect x="22" y="20" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="36" y="46" font-size="12" fill="#1E6BBD" font-weight="600" text-anchor="start">1</text><text x="52" y="46" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Read</text><text x="36" y="68" font-size="11.5" fill="#5B6573" text-anchor="start">.xls  .xlsx  .csv</text><rect x="182" y="20" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="196" y="46" font-size="12" fill="#1E6BBD" font-weight="600" text-anchor="start">2</text><text x="212" y="46" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Recognise</text><text x="196" y="68" font-size="11.5" fill="#5B6573" text-anchor="start">known form</text><text x="196" y="85" font-size="11.5" fill="#5B6573" text-anchor="start">or any sheet</text><line x1="161" y1="62" x2="173" y2="62" stroke="#9AA4B2" stroke-width="1.5"/><path d="M172,58 L179,62 L172,66 Z" fill="#9AA4B2"/><rect x="342" y="20" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="356" y="46" font-size="12" fill="#1E6BBD" font-weight="600" text-anchor="start">3</text><text x="372" y="46" font-size="14" fill="#002157" font-weight="600" text-anchor="start">De-identify</text><text x="356" y="68" font-size="11.5" fill="#5B6573" text-anchor="start">drop or</text><text x="356" y="85" font-size="11.5" fill="#5B6573" text-anchor="start">pseudonymise</text><line x1="321" y1="62" x2="333" y2="62" stroke="#9AA4B2" stroke-width="1.5"/><path d="M332,58 L339,62 L332,66 Z" fill="#9AA4B2"/><rect x="502" y="20" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="516" y="46" font-size="12" fill="#1E6BBD" font-weight="600" text-anchor="start">4</text><text x="532" y="46" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Map and clean</text><text x="516" y="68" font-size="11.5" fill="#5B6573" text-anchor="start">answers to codes,</text><text x="516" y="85" font-size="11.5" fill="#5B6573" text-anchor="start">dates to YYYY-MM-DD</text><line x1="481" y1="62" x2="493" y2="62" stroke="#9AA4B2" stroke-width="1.5"/><path d="M492,58 L499,62 L492,66 Z" fill="#9AA4B2"/><rect x="662" y="20" width="136" height="84" rx="10" fill="#E8F0FA" stroke="#1E6BBD"/><text x="676" y="46" font-size="12" fill="#1E6BBD" font-weight="600" text-anchor="start">5</text><text x="692" y="46" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Review</text><text x="676" y="68" font-size="11.5" fill="#5B6573" text-anchor="start">check, edit,</text><text x="676" y="85" font-size="11.5" fill="#5B6573" text-anchor="start">skip rows</text><line x1="641" y1="62" x2="653" y2="62" stroke="#9AA4B2" stroke-width="1.5"/><path d="M652,58 L659,62 L652,66 Z" fill="#9AA4B2"/><rect x="822" y="20" width="136" height="84" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="836" y="46" font-size="12" fill="#1E6BBD" font-weight="600" text-anchor="start">6</text><text x="852" y="46" font-size="14" fill="#002157" font-weight="600" text-anchor="start">Upload</text><text x="836" y="68" font-size="11.5" fill="#5B6573" text-anchor="start">in batches to</text><text x="836" y="85" font-size="11.5" fill="#5B6573" text-anchor="start">your project</text><line x1="801" y1="62" x2="813" y2="62" stroke="#9AA4B2" stroke-width="1.5"/><path d="M812,58 L819,62 L812,66 Z" fill="#9AA4B2"/><rect x="22" y="126" width="776" height="36" rx="10" fill="#F4F7FB" stroke="#DDE3EB"/><text x="38" y="149" font-size="12.5" fill="#5B6573" text-anchor="start">On your computer. Nothing is sent until you click Upload.</text><rect x="822" y="126" width="136" height="36" rx="10" fill="#1E6BBD" stroke="#1E6BBD"/><text x="890" y="149" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">REDCap project</text></svg>

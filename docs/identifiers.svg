<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 386" width="980" height="386" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img"><title>How each column is handled</title><rect width="980" height="386" fill="#FFFFFF"/><text x="22" y="22" font-size="12" fill="#5B6573" font-weight="600" text-anchor="start">In your file</text><text x="668" y="22" font-size="12" fill="#5B6573" font-weight="600" text-anchor="start">In REDCap</text><rect x="22" y="34" width="300" height="68" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="38" y="62" font-size="13" fill="#002157" text-anchor="start">Name, address</text><text x="38" y="83" font-size="13" fill="#002157" text-anchor="start">phone, e-mail</text><line x1="330" y1="78" x2="654" y2="78" stroke="#9AA4B2" stroke-width="1.5"/><path d="M653,74 L660,78 L653,82 Z" fill="#9AA4B2"/><rect x="668" y="34" width="290" height="68" rx="10" fill="#F4F7FB" stroke="#DDE3EB"/><text x="684" y="62" font-size="13" fill="#002157" font-weight="600" text-anchor="start">Left out</text><text x="684" y="81" font-size="12" fill="#5B6573" text-anchor="start">Never uploaded.</text><rect x="22" y="118" width="300" height="68" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="38" y="146" font-size="13" fill="#002157" text-anchor="start">National ID (NIK)</text><text x="38" y="167" font-size="13" fill="#002157" text-anchor="start">register number</text><line x1="330" y1="162" x2="654" y2="162" stroke="#9AA4B2" stroke-width="1.5"/><path d="M653,158 L660,162 L653,166 Z" fill="#9AA4B2"/><rect x="440" y="122" width="100" height="22" rx="11" fill="#E8F0FA" stroke="#1E6BBD"/><text x="490" y="137" font-size="11.5" fill="#1E6BBD" text-anchor="middle">secret key</text><rect x="668" y="118" width="290" height="68" rx="10" fill="#F4F7FB" stroke="#DDE3EB"/><text x="684" y="146" font-size="13" fill="#002157" font-weight="600" text-anchor="start">A code made with your key</text><text x="684" y="165" font-size="12" fill="#5B6573" text-anchor="start">Same input and key, same code.</text><rect x="22" y="202" width="300" height="68" rx="10" fill="#FFFFFF" stroke="#DDE3EB"/><text x="38" y="230" font-size="13" fill="#002157" text-anchor="start">Age, sex, dates</text><text x="38" y="251" font-size="13" fill="#002157" text-anchor="start">results, answers</text><line x1="330" y1="246" x2="654" y2="246" stroke="#9AA4B2" stroke-width="1.5"/><path d="M653,242 L660,246 L653,250 Z" fill="#9AA4B2"/><rect x="668" y="202" width="290" height="68" rx="10" fill="#F4F7FB" stroke="#DDE3EB"/><text x="684" y="230" font-size="13" fill="#002157" font-weight="600" text-anchor="start">Uploaded</text><text x="684" y="249" font-size="12" fill="#5B6573" text-anchor="start">After the checks.</text><text x="22" y="294" font-size="12" fill="#5B6573"><tspan fill="#002157" font-weight="600">Known form:</tspan> from the form's own list of columns.</text><text x="22" y="319" font-size="12" fill="#5B6573"><tspan fill="#002157" font-weight="600">Any other sheet:</tspan> by the words in the header (name, address, phone)</text><text x="22" y="336" font-size="12" fill="#5B6573" text-anchor="start">and by how the values look (16 digits, phone or e-mail pattern, a person's name,</text><text x="22" y="353" font-size="12" fill="#5B6573" text-anchor="start">long free text). You review every column before it is used.</text></svg>

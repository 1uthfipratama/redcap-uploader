# Builds the Windows installer and the macOS .dmg, and smoke-tests each built
# package (not the source). Runs only when started by hand (Actions > Build
# installers > Run workflow) or when a version tag such as v0.1.0 is pushed,
# because macOS minutes count ten times on a private repository.
#
# Optional signing secrets (skipped cleanly when absent):
#   WINDOWS_CERT_PFX (base64 of a .pfx), WINDOWS_CERT_PASSWORD
#   MACOS_CERT_P12 (base64 of a .p12), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
name: Build installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which installers to build
        type: choice
        options: [both, windows, macos]
        default: both
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build the app
        run: python -m PyInstaller build/redcap_uploader.spec --noconfirm --workpath build/out/work --distpath dist
      - name: Smoke-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\REDCap Uploader\REDCap Uploader.exe" -ArgumentList "--smoke-test","--smoke-report","smoke-windows.json" -Wait -PassThru
          Get-Content smoke-windows.json
          if ($p.ExitCode -ne 0) { throw "smoke test failed" }
      - name: Sign the app
        if: env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\REDCap Uploader\REDCap Uploader.exe"
          Remove-Item cert.pfx
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" build\windows\installer.iss
      - name: Sign the installer
        if: env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem dist\installer\*.exe | ForEach-Object { & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
          Remove-Item cert.pfx
      - name: Size and start-up time
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen  # CI machines have no screen to show the window on
        run: |
          $installer = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Start-Process -FilePath "dist\REDCap Uploader\REDCap Uploader.exe" -ArgumentList "--quit-after-start" -Wait | Out-Null
          $sw.Stop()
          "| Windows | installer $([math]::Round($installer.Length/1MB,1)) MB | start-up $([math]::Round($sw.Elapsed.TotalSeconds,1)) s |" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/installer/*.exe
            smoke-windows.json

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: macos-14  # Apple silicon
    timeout-minutes: 45
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build the app
        run: python -m PyInstaller build/redcap_uploader.spec --noconfirm --workpath build/out/work --distpath dist
      - name: Smoke-test the built app
        run: |
          "dist/REDCap Uploader.app/Contents/MacOS/REDCap Uploader" --smoke-test --smoke-report smoke-macos.json
          cat smoke-macos.json
      - name: Import the signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build the .dmg
        run: bash build/macos/make_dmg.sh
      - name: Size and start-up time
        env:
          QT_QPA_PLATFORM: offscreen  # CI machines have no screen to show the window on
        run: |
          size=$(du -m dist/*.dmg | cut -f1)
          start=$(date +%s.%N)
          "dist/REDCap Uploader.app/Contents/MacOS/REDCap Uploader" --quit-after-start
          end=$(date +%s.%N)
          echo "| macOS | dmg ${size} MB | start-up $(echo "$end - $start" | bc) s |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            smoke-macos.json

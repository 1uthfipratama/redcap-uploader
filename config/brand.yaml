# Visual identity, following Yayasan RPRI (https://yayasanrpri.org/).
# Change the look here, not in code.
name: RPRI
product_name: REDCap Uploader
colors:
  primary: "#1E6BBD"        # RPRI blue
  primary_hover: "#185A9F"
  primary_soft: "#E8F0FA"   # selected rows, active step background
  navy: "#002157"           # headings
  text: "#1D1E20"
  muted: "#5B6573"
  canvas: "#F4F7FB"         # window background
  surface: "#FFFFFF"        # panels
  border: "#DDE3EB"
  error: "#B42318"
  warning: "#9A6700"
  success: "#1D7A4F"
fonts:
  heading: Rubik
  body: DM Sans
  fallback: ["Segoe UI", "Helvetica Neue", "Arial"]
radius:
  button: 16
  panel: 12
# Optional files; the app uses text instead when they are missing.
logo: app/assets/brand/logo.png
icon: app/assets/brand/icon.png   # window and taskbar icon; python -m tools.make_icons SOURCE.png writes all three icon files
fonts_dir: app/assets/fonts
# Chart colours: series 1 is the brand blue; 2-4 follow the validated reference order
# (checked with the colour-blindness validator: all adjacent pairs pass). Grey is for
# "unknown", "blank" and "other", which are context rather than a series of their own.
chart:
  series: ["#1E6BBD", "#EB6834", "#1BAF7A", "#EDA100"]
  neutral: "#A7B0BC"
  grid: "#E6EAF0"
# Packaging
bundle_id: org.yayasanrpri.redcap-uploader   # macOS bundle identifier
publisher: Yayasan RPRI
icon_windows: app/assets/brand/icon.ico       # optional; the default icon is used when missing
icon_macos: app/assets/brand/icon.icns
